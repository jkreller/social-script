<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Script — Code</title>
  <link rel="stylesheet" href="/assets/exhibit.css">
</head>
<body class="code-page">

  <section id="list-view" class="screen">
    <div id="list"></div>
  </section>

  <section id="code-view" class="screen" hidden>
    <div id="code-panel">
      <pre id="source"></pre>
    </div>
    <div id="controls">
      <button id="back" class="ctrl-btn">List</button>
      <button id="play-pause" class="ctrl-btn" title="Play / Pause">▶</button>
      <button id="step-back" class="ctrl-btn" title="Previous line">◀</button>
      <button id="step-fwd" class="ctrl-btn" title="Next line">▶</button>
      <span id="time-display" class="time">0:00 / 0:00</span>
      <input id="scrubber" type="range" min="0" max="0" value="0" step="0.1">
      <span id="script-name"></span>
    </div>
  </section>

  <script src="/assets/packages/highlight.min.js"></script>
  <script type="module" src="/assets/code.js"></script>
</body>
</html>
