<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Script — Code</title>
  <link rel="stylesheet" href="/assets/exhibit.css">
</head>
<body class="code-page">

  <section id="code-view" class="screen" hidden>
    <div id="code-panel">
      <pre id="source"></pre>
    </div>
  </section>

  <section id="story-view" class="screen" hidden>
    <div class="story-card">
      <div id="story-meta" class="card-meta"></div>
      <div id="story-title" class="card-title"></div>
      <div id="story-body" class="story-body"></div>
    </div>
  </section>

  <section id="interstitial" class="screen" hidden>
    <div class="card">
      <div id="interstitial-script" class="card-title"></div>
      <div id="interstitial-meta" class="card-meta"></div>
    </div>
  </section>

  <button id="debug-end" type="button" title="Debug: jump to end of this execution">⏭ end</button>

  <script src="/assets/packages/highlight.min.js"></script>
  <script type="module" src="/assets/code.js"></script>
</body>
</html>
